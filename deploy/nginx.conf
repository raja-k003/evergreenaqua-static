# /etc/nginx/sites-available/smparamount.in
# Certificates: sudo certbot --nginx -d smparamount.in -d www.smparamount.in

upstream smparamount_ssr {
  server 127.0.0.1:4000;
  keepalive 32;
}

# http → https, www → apex (one canonical host)
server {
  listen 80;
  listen [::]:80;
  server_name smparamount.in www.smparamount.in;
  return 301 https://smparamount.in$request_uri;
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.smparamount.in;
  ssl_certificate     /etc/letsencrypt/live/smparamount.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/smparamount.in/privkey.pem;
  return 301 https://smparamount.in$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name smparamount.in;

  ssl_certificate     /etc/letsencrypt/live/smparamount.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/smparamount.in/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Compression (use brotli too if the ngx_brotli module is installed)
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  root /var/www/smparamount/dist/smparamount/browser;

  # Hashed build assets: serve directly from disk, cache for a year.
  location ~* "-[A-Za-z0-9_]{8}\.(js|css)$" {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Images, icons, fonts and videos in /public (nginx serves byte ranges, so seeking works)
  location ~* \.(webp|avif|png|jpe?g|svg|ico|woff2|mp4|webm)$ {
    try_files $uri @ssr;
    add_header Cache-Control "public, max-age=2592000";
  }

  # Everything else (pages, sitemap.xml, robots.txt, /api, redirects, 404s)
  # goes to the Node SSR server so status codes and headers stay correct.
  location / {
    try_files /__nonexistent__ @ssr;
  }

  location @ssr {
    proxy_pass http://smparamount_ssr;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
