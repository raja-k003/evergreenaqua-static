<header class="site-header" [class.is-scrolled]="scrolled()">
  <div class="container bar">
    <a class="brand" routerLink="/" aria-label="Evergreen Aqua Systems – home">
      <img class="brand__logo" src="/images/evergreen-aqua-logo.png" alt="Evergreen Aqua Systems" width="916" height="778" />
    </a>

    <nav id="main-nav" class="nav" [class.is-open]="menuOpen()" aria-label="Main">
      <ul class="nav__list">
        @for (item of nav; track item.label) {
          @if (isGroup(item)) {
            <li class="nav__item has-sub" [class.is-open]="openGroup() === item.label">
              <button
                type="button"
                class="nav__link nav__toggle"
                [attr.data-group]="item.label"
                [attr.aria-expanded]="openGroup() === item.label"
                [attr.aria-controls]="groupId(item)"
                (click)="toggleGroup(item)"
              >
                {{ item.label }} <app-icon name="chevron-down" [size]="16" />
              </button>
              <ul class="sub" [id]="groupId(item)">
                @for (child of item.children; track child.path) {
                  <li>
                    <a
                      [routerLink]="child.path"
                      routerLinkActive="is-active"
                      ariaCurrentWhenActive="page"
                      [routerLinkActiveOptions]="{ exact: !!child.exact }"
                      >{{ child.label }}</a
                    >
                  </li>
                }
              </ul>
            </li>
          } @else {
            <li class="nav__item">
              <a
                class="nav__link"
                [routerLink]="item.path"
                routerLinkActive="is-active"
                ariaCurrentWhenActive="page"
                [routerLinkActiveOptions]="{ exact: !!item.exact }"
                >{{ item.label }}</a
              >
            </li>
          }
        }
      </ul>
      <div class="nav__mobile-cta">
        <a appButton block [href]="'tel:' + site.phones[0].e164"><app-icon name="phone" [size]="18" /> Call {{ site.phones[0].display }}</a>
        <a appButton block variant="outline" routerLink="/contact">Book a free water test</a>
      </div>
    </nav>

    <div class="actions">
      <app-theme-switcher />
      <a appButton size="sm" class="quote" routerLink="/contact">Get a quote</a>
      <button
        type="button"
        class="btn btn--ghost btn--icon menu-toggle"
        aria-controls="main-nav"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <app-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="24" [label]="menuOpen() ? 'Close menu' : 'Open menu'" />
      </button>
    </div>
  </div>
</header>
